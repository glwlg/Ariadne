version: '3'

vars:
  APP_NAME: fancun
  BIN_DIR: bin
  APP_VERSION: '{{.FANCUN_VERSION | default "dev"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Build Fancun for the current platform.
    cmds:
      - wails3 task windows:build

  windows:build:
    summary: Build Fancun for Windows.
    cmds:
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.BIN_DIR}}' | Out-Null"
      - wails3 task native:capture-host
      - wails3 task native:uxplay
      - wails3 task native:iphone-control
      - wails3 generate bindings -clean=false
      - powershell -NoProfile -Command "Set-Location frontend; pnpm build"
      - wails3 task windows:resources
      - go build -ldflags="-H windowsgui -X main.appVersion={{.APP_VERSION}}" -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe" .

  windows:mcp-build:
    summary: Build a development-only Fancun executable with the Wails MCP server.
    cmds:
      - powershell -NoProfile -Command "New-Item -ItemType Directory -Force -Path '{{.BIN_DIR}}' | Out-Null"
      - wails3 task native:capture-host
      - wails3 task native:uxplay
      - wails3 task native:iphone-control
      - wails3 generate bindings -clean=false
      - powershell -NoProfile -Command "Set-Location frontend; pnpm build"
      - wails3 task windows:resources
      - go build -tags=mcp -ldflags="-H windowsgui -X main.appVersion={{.APP_VERSION}}" -o "{{.BIN_DIR}}/{{.APP_NAME}}-mcp.exe" .

  windows:mcp-dev:
    summary: Run the development-only MCP build on loopback with a random available port.
    cmds:
      - wails3 task windows:mcp-build
      - powershell -NoProfile -Command "$env:WAILS_MCP_HOST='127.0.0.1'; $env:WAILS_MCP_PORT='0'; & '{{.BIN_DIR}}\{{.APP_NAME}}-mcp.exe'"

  native:uxplay:
    summary: Build and verify the bundled Windows x64 AirPlay receiver.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-uxplay.ps1

  native:iphone-control:
    summary: Publish the Bluetooth HID iPhone control window.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-iphone-control.ps1

  native:capture-host:
    summary: Publish the shared WPF host for Windows screenshots and network mini.
    cmds:
      - powershell -NoProfile -Command "if (-not ([System.IO.Path]::GetFullPath((Join-Path (Get-Location) '{{.BIN_DIR}}\native-capture')).StartsWith([System.IO.Path]::GetFullPath((Get-Location).Path), [System.StringComparison]::OrdinalIgnoreCase))) { throw 'Refusing to clean outside workspace' }; if (Test-Path -LiteralPath '{{.BIN_DIR}}\native-capture') { Remove-Item -LiteralPath '{{.BIN_DIR}}\native-capture' -Recurse -Force }; New-Item -ItemType Directory -Force -Path '{{.BIN_DIR}}\native-capture' | Out-Null"
      - powershell -NoProfile -Command "if (Test-Path 'C:\Users\luwei\.codex\tools\dotnet-sdk-8.0\dotnet.exe') { & 'C:\Users\luwei\.codex\tools\dotnet-sdk-8.0\dotnet.exe' publish native\Fancun.CaptureHost\Fancun.CaptureHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o '{{.BIN_DIR}}\native-capture' } else { dotnet publish native\Fancun.CaptureHost\Fancun.CaptureHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false -o '{{.BIN_DIR}}\native-capture' }"

  windows:resources:
    summary: Generate Windows icon, manifest, and version resources for Fancun.
    cmds:
      - go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json --arch amd64 --out fancun_resource.syso --no-suffix

  windows:package:
    summary: Build Fancun and create a user-level Windows setup exe plus updater checksum.
    cmds:
      - wails3 task windows:verify
      - wails3 task windows:build
      - powershell -NoProfile -Command "if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable('FANCUN_VERSION'))) { go run ./cmd/releasepack -version dev } else { go run ./cmd/releasepack -version ([Environment]::GetEnvironmentVariable('FANCUN_VERSION')) }"

  windows:setup:
    summary: Alias for windows:package; produces FancunSetup-<version>-windows-x64.exe.
    cmds:
      - wails3 task windows:package

  windows:msix:
    summary: Build Fancun and create an unsigned MSIX layout.
    cmds:
      - wails3 task windows:verify
      - wails3 task windows:build
      - powershell -NoProfile -Command "if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable('FANCUN_VERSION'))) { go run ./cmd/msixpack -version dev } else { go run ./cmd/msixpack -version ([Environment]::GetEnvironmentVariable('FANCUN_VERSION')) }"

  windows:msix-pack:
    summary: Build Fancun and pack an unsigned MSIX with makeappx.exe.
    cmds:
      - wails3 task windows:verify
      - wails3 task windows:build
      - powershell -NoProfile -Command "if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable('FANCUN_VERSION'))) { go run ./cmd/msixpack -version dev -pack } else { go run ./cmd/msixpack -version ([Environment]::GetEnvironmentVariable('FANCUN_VERSION')) -pack }"

  windows:perf:
    summary: Run the Windows desktop performance acceptance probe.
    cmds:
      - go run ./cmd/perfcheck -iterations 3 -pretty -output dist/perf/fancun-perf-latest.json

  windows:search-perf:
    summary: Run the repeatable Fancun search p95 benchmark.
    cmds:
      - go run ./cmd/searchbench -iterations 20 -warmup 2 -pretty -output dist/perf/fancun-search-perf-latest.json

  windows:autostart-smoke:
    summary: Run a non-destructive HKCU Run autostart registration smoke.
    cmds:
      - go run ./cmd/autostartsmoke -exe bin/fancun.exe -output dist/perf/fancun-autostart-smoke-latest.json

  dev:
    summary: Run the Fancun frontend in browser development mode.
    cmds:
      - powershell -NoProfile -Command "Set-Location frontend; pnpm dev -- --host 127.0.0.1 --port {{.VITE_PORT}}"

  test:
    summary: Run Fancun backend and frontend checks.
    cmds:
      - wails3 task windows:verify

  windows:verify:
    summary: Run release checks including isolated setup upgrade, shortcuts and native input regressions.
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release.ps1
